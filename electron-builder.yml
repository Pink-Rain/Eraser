appId: fr.eraserjdr.app
productName: Eraser - JDR
copyright: Copyright © 2026 Eraser
directories:
  output: release
files:
  - desktop/*.cjs
  - package.json
extraResources:
  - from: dist/eraser-server.asar
    to: eraser-server.asar
  - from: drizzle
    to: migrations
  - from: build-resources/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Eraser-Setup.${ext}
  icon: build-resources/icon.png
  # Pinned independently of productName: existing users' desktop/taskbar
  # shortcuts point at this literal file. Renaming it would silently break
  # every shortcut created before this change on their next auto-update.
  executableName: Eraser
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Eraser - JDR
  uninstallDisplayName: Eraser - JDR
publish:
  provider: github
  owner: Pink-Rain
  repo: Eraser
asar: true
