name: Déployer le Worker de comptes partagés

# Déploie/maintient le petit Worker Cloudflare "eraser-accounts" (voir
# worker-accounts/). Ce Worker est totalement distinct du site Sites/Cloudflare
# historique : il ne sert que d'annuaire partagé pour les comptes, les rôles et
# la connexion Google Drive entre toutes les installations Windows d'Eraser.
# Ne jamais réutiliser ce workflow pour le site Sites/Cloudflare en ligne.
on:
  workflow_dispatch:
  push:
    branches:
      - windows-app-migration
    paths:
      - "worker-accounts/**"
      - ".github/workflows/deploy-accounts-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-accounts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer wrangler
        run: npm install --no-save wrangler@4

      - name: Créer la base D1 si nécessaire
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          find_id() {
            npx wrangler d1 list --json | node -e '
              let data = "";
              process.stdin.on("data", (chunk) => { data += chunk; });
              process.stdin.on("end", () => {
                const list = JSON.parse(data);
                const db = list.find((entry) => entry.name === "eraser-accounts-db");
                console.log(db ? db.uuid : "");
              });
            '
          }
          EXISTING_ID=$(find_id)
          if [ -z "$EXISTING_ID" ]; then
            echo "Base introuvable, création…"
            # wrangler d1 create prints the id in a format that differs across
            # versions (JSON snippet vs TOML), so re-list rather than parse it.
            npx wrangler d1 create eraser-accounts-db
            EXISTING_ID=$(find_id)
            if [ -z "$EXISTING_ID" ]; then
              echo "La base vient d'être créée mais n'apparaît pas dans wrangler d1 list." >&2
              exit 1
            fi
          else
            echo "Base existante réutilisée."
          fi
          echo "database_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"

      - name: Écrire l'identifiant de la base dans la configuration
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const config = JSON.parse(raw);
            config.d1_databases[0].database_id = process.env.DATABASE_ID;
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2));
          '

      - name: Appliquer le schéma D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Toujours ré-appliqué (schema.sql n'utilise que CREATE TABLE/INDEX
        # IF NOT EXISTS, donc sans risque) : rattrape le cas où une exécution
        # précédente avait créé la base sans jamais exécuter le schéma.
        # `d1 execute` résout la base par son nom depuis wrangler.jsonc, pas
        # de flag --database-id (il n'existe pas).
        run: npx wrangler d1 execute eraser-accounts-db --remote --file=./schema.sql

      - name: Enregistrer un sous-domaine workers.dev si nécessaire
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CURRENT=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          HAS_SUBDOMAIN=$(echo "$CURRENT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain||"")}catch(e){console.log("")}})')
          if [ -n "$HAS_SUBDOMAIN" ]; then
            echo "Sous-domaine workers.dev déjà enregistré : $HAS_SUBDOMAIN"
          else
            echo "Aucun sous-domaine workers.dev, enregistrement de eraser-jdr…"
            RESPONSE=$(curl -sS -X PUT "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "content-type: application/json" \
              -d '{"subdomain":"eraser-jdr"}')
            OK=$(echo "$RESPONSE" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).success)}catch(e){console.log("false")}})')
            if [ "$OK" != "true" ]; then
              echo "$RESPONSE"
              echo "Impossible d'enregistrer eraser-jdr.workers.dev (probablement déjà pris)." >&2
              exit 1
            fi
            echo "Sous-domaine eraser-jdr.workers.dev enregistré."
          fi

      - name: Déployer le Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configurer les secrets du Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERASER_API_KEY: ${{ secrets.ERASER_ACCOUNTS_API_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.ERASER_ACCOUNTS_TOKEN_ENCRYPTION_KEY }}
          ADMIN_EMAIL: ${{ secrets.ERASER_ADMIN_EMAIL }}
          ADMIN_SETUP_CODE: ${{ secrets.ERASER_ADMIN_SETUP_CODE }}
        run: |
          printf '%s' "$ERASER_API_KEY" | npx wrangler secret put ERASER_API_KEY
          printf '%s' "$TOKEN_ENCRYPTION_KEY" | npx wrangler secret put TOKEN_ENCRYPTION_KEY
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_SETUP_CODE" | npx wrangler secret put ADMIN_SETUP_CODE
