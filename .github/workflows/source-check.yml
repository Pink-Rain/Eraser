name: Vérifier l’application Eraser

on:
  push:
    branches:
      - windows-app-migration
  workflow_dispatch:

jobs:
  build-current-source:
    name: Lint, tests et serveur desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run lint

      - name: Construire l’interface
        run: npm run build

      - name: Exécuter les tests applicables
        run: npm run test:ci

      - name: Construire le serveur desktop
        run: npm run desktop:build

      - name: Vérifier le serveur desktop
        run: npm run desktop:verify
