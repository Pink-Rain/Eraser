name: Vérifier la source Eraser

on:
  push:
    branches:
      - windows-app-migration
  workflow_dispatch:

jobs:
  build-current-source:
    name: Construire la version récupérée
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Vérifier la fidélité avec la source du site
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/verify-site-parity.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Construire Eraser
        run: npm run build
