name: Construire Eraser pour Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-app-migration
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l’installateur
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tester l’installation et le démarrage
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/Eraser-Setup.exe"
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $executable = Join-Path $env:LOCALAPPDATA "Programs/Eraser/Eraser.exe"
          if (-not (Test-Path $executable)) {
            throw "Eraser.exe est introuvable après l’installation."
          }
          $process = Start-Process -FilePath $executable -PassThru
          $ready = Join-Path $env:APPDATA "Eraser/startup-ready.json"
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $ready)) {
            if ($process.HasExited) {
              throw "Eraser s’est fermé avant que son serveur local soit prêt."
            }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $ready)) {
            $log = Join-Path $env:APPDATA "Eraser/logs/eraser-startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Eraser n’a pas confirmé son démarrage complet."
          }
          $startup = Get-Content $ready -Raw | ConvertFrom-Json
          $response = Invoke-WebRequest -Uri "$($startup.url)/connexion" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "La fenêtre Eraser ne reçoit pas la page de connexion." }
          Write-Host "Application installée et réellement prête sur $($startup.url)."
          Get-Process -Name "Eraser" -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Conserver l’installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Eraser-Windows
          path: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap

      - name: Publier la préversion de migration
        if: github.ref == 'refs/heads/windows-app-migration' && contains(github.event.head_commit.message, '[publish alpha]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "release/Eraser-Setup.exe" `
            "release/latest.yml" `
            "release/Eraser-Setup.exe.blockmap" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Eraser v$version" `
            --notes-file "RELEASE_ALPHA.md" `
            --prerelease
