name: Construire Eraser pour Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-app-migration
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer la configuration de l’annuaire de comptes partagé
        shell: bash
        env:
          ERASER_ACCOUNTS_API_URL: ${{ secrets.ERASER_ACCOUNTS_API_URL }}
          ERASER_ACCOUNTS_API_KEY: ${{ secrets.ERASER_ACCOUNTS_API_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const url = process.env.ERASER_ACCOUNTS_API_URL || '';
            const apiKey = process.env.ERASER_ACCOUNTS_API_KEY || '';
            const body = 'module.exports = ' + JSON.stringify({ url, apiKey }, null, 2) + ';\n';
            fs.writeFileSync('desktop/accounts-config.generated.cjs', body, 'utf8');
          "

      - name: Construire l’installateur
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier les fichiers de mise à jour automatique
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $metadata = Join-Path $PWD "release/latest.yml"
          $blockmap = Join-Path $PWD "release/Eraser-Setup.exe.blockmap"
          if (-not (Test-Path $metadata)) { throw "latest.yml est absent." }
          if (-not (Test-Path $blockmap)) { throw "Le fichier de mise à jour différentielle est absent." }
          $content = Get-Content $metadata -Raw
          if ($content -notmatch "version:\s+$([regex]::Escape($version))") {
            throw "latest.yml ne correspond pas à la version $version."
          }
          if ($content -notmatch "path:\s+Eraser-Setup.exe") {
            throw "latest.yml ne pointe pas vers l’installateur Eraser."
          }
          $hot = Join-Path $PWD "dist/eraser-update.json"
          if (-not (Test-Path $hot)) { throw "La mise à jour sans réinstallation (eraser-update.json) est absente." }
          if (-not (Test-Path (Join-Path $PWD "dist/eraser-update.asar.gz"))) { throw "Le serveur compressé eraser-update.asar.gz est absent." }
          $manifest = Get-Content $hot -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "eraser-update.json ne correspond pas à la version $version." }

      - name: Tester l’installation et le démarrage
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/Eraser-Setup.exe"
          $setup = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          Write-Host "Installateur terminé (code $($setup.ExitCode))."
          # L'installateur assisté (non one-click) peut se relancer lui-même : -Wait
          # rend la main quand le premier processus sort, pas quand la copie est
          # finie. On attend donc aussi ses processus enfants encore actifs.
          $setupDeadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $setupDeadline -and (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like "Eraser-Setup*" -or $_.ProcessName -like "Un_*" })) {
            Start-Sleep -Seconds 2
          }
          # Search rather than assume "Programs/Eraser/Eraser.exe": the install
          # folder name follows productName (currently "Eraser - JDR"), while
          # win.executableName pins the .exe itself to "Eraser.exe" so existing
          # shortcuts keep working. Searching avoids re-hardcoding that folder
          # name here every time productName changes.
          # Selon la machine GitHub, l'installation silencieuse se fait pour
          # l'utilisateur (LOCALAPPDATA\Programs) ou pour la machine (Program
          # Files) : on cherche aux deux endroits, jusqu'à 5 minutes (3 ne
          # suffisaient plus sur alpha.71).
          $searchRoots = @((Join-Path $env:LOCALAPPDATA "Programs"), $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path $_) }
          $executable = $null
          $installDeadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $installDeadline -and -not $executable) {
            $found = Get-ChildItem -Path $searchRoots -Filter "Eraser.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $executable = $found.FullName }
            else { Start-Sleep -Seconds 2 }
          }
          if (-not $executable) {
            Write-Host "Dossiers d'installation inspectés :"
            foreach ($root in $searchRoots) { Write-Host "- $root"; Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $($_.Name)" } }
            Write-Host "Processus encore actifs liés à l'installation :"
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match "Eraser|Setup|Un_" } | ForEach-Object { Write-Host "    $($_.ProcessName) ($($_.Id))" }
            throw "Eraser.exe est introuvable après l’installation."
          }
          Write-Host "Eraser installé : $executable"
          $env:ERASER_READY_FILE = Join-Path $PWD "eraser-startup-ready.json"
          $env:ERASER_STARTUP_LOG = Join-Path $PWD "eraser-startup.log"
          $env:ERASER_UI_SMOKE_RESULT = Join-Path $PWD "eraser-ui-smoke.json"
          $process = Start-Process -FilePath $executable -PassThru
          $ready = $env:ERASER_READY_FILE
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $ready)) {
            if ($process.HasExited) {
              throw "Eraser s’est fermé avant que son serveur local soit prêt."
            }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $ready)) {
            $log = $env:ERASER_STARTUP_LOG
            if (Test-Path $log) { Get-Content $log }
            throw "Eraser n’a pas confirmé son démarrage complet."
          }
          $startup = Get-Content $ready -Raw | ConvertFrom-Json
          $response = Invoke-WebRequest -Uri "$($startup.url)/connexion" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "La fenêtre Eraser ne reçoit pas la page de connexion." }
          $uiDeadline = (Get-Date).AddMinutes(1)
          while ((Get-Date) -lt $uiDeadline -and -not (Test-Path $env:ERASER_UI_SMOKE_RESULT)) {
            if ($process.HasExited) { throw "Eraser s’est fermé pendant le test de l’interface." }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $env:ERASER_UI_SMOKE_RESULT)) {
            if (Test-Path $env:ERASER_STARTUP_LOG) { Get-Content $env:ERASER_STARTUP_LOG }
            throw "L’interface installée n’a pas terminé son test de connexion."
          }
          $uiResult = Get-Content $env:ERASER_UI_SMOKE_RESULT -Raw | ConvertFrom-Json
          if (-not $uiResult.ok) {
            if (Test-Path $env:ERASER_STARTUP_LOG) { Get-Content $env:ERASER_STARTUP_LOG }
            throw "Le test interactif a échoué : $($uiResult.error)"
          }
          Write-Host "Application installée, interface interactive, compte créé et session ouverte sur $($startup.url)."
          Get-Process -Name "Eraser" -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Conserver l’installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Eraser-Windows
          path: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap
            dist/eraser-update.json
            dist/eraser-update.asar.gz
          if-no-files-found: error

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap
            dist/eraser-update.json
            dist/eraser-update.asar.gz

      - name: Publier la préversion de migration
        if: github.ref == 'refs/heads/windows-app-migration' && contains(github.event.head_commit.message, '[publish alpha]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "release/Eraser-Setup.exe" `
            "release/latest.yml" `
            "release/Eraser-Setup.exe.blockmap" `
            "dist/eraser-update.json" `
            "dist/eraser-update.asar.gz" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Eraser v$version" `
            --notes-file "RELEASE_ALPHA.md" `
            --prerelease
