name: Construire Eraser pour Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-app-migration
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier la fidélité avec la source du site
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/verify-site-parity.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l’installateur
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier les fichiers de mise à jour automatique
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $metadata = Join-Path $PWD "release/latest.yml"
          $blockmap = Join-Path $PWD "release/Eraser-Setup.exe.blockmap"
          if (-not (Test-Path $metadata)) { throw "latest.yml est absent." }
          if (-not (Test-Path $blockmap)) { throw "Le fichier de mise à jour différentielle est absent." }
          $content = Get-Content $metadata -Raw
          if ($content -notmatch "version:\s+$([regex]::Escape($version))") {
            throw "latest.yml ne correspond pas à la version $version."
          }
          if ($content -notmatch "path:\s+Eraser-Setup.exe") {
            throw "latest.yml ne pointe pas vers l’installateur Eraser."
          }

      - name: Tester l’installation et le démarrage
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/Eraser-Setup.exe"
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $executable = Join-Path $env:LOCALAPPDATA "Programs/Eraser/Eraser.exe"
          if (-not (Test-Path $executable)) {
            throw "Eraser.exe est introuvable après l’installation."
          }
          $env:ERASER_READY_FILE = Join-Path $PWD "eraser-startup-ready.json"
          $env:ERASER_STARTUP_LOG = Join-Path $PWD "eraser-startup.log"
          $env:ERASER_UI_SMOKE_RESULT = Join-Path $PWD "eraser-ui-smoke.json"
          $process = Start-Process -FilePath $executable -PassThru
          $ready = $env:ERASER_READY_FILE
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $ready)) {
            if ($process.HasExited) {
              throw "Eraser s’est fermé avant que son serveur local soit prêt."
            }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $ready)) {
            $log = $env:ERASER_STARTUP_LOG
            if (Test-Path $log) { Get-Content $log }
            throw "Eraser n’a pas confirmé son démarrage complet."
          }
          $startup = Get-Content $ready -Raw | ConvertFrom-Json
          $response = Invoke-WebRequest -Uri "$($startup.url)/connexion" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "La fenêtre Eraser ne reçoit pas la page de connexion." }
          $uiDeadline = (Get-Date).AddMinutes(1)
          while ((Get-Date) -lt $uiDeadline -and -not (Test-Path $env:ERASER_UI_SMOKE_RESULT)) {
            if ($process.HasExited) { throw "Eraser s’est fermé pendant le test de l’interface." }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $env:ERASER_UI_SMOKE_RESULT)) {
            if (Test-Path $env:ERASER_STARTUP_LOG) { Get-Content $env:ERASER_STARTUP_LOG }
            throw "L’interface installée n’a pas terminé son test de connexion."
          }
          $uiResult = Get-Content $env:ERASER_UI_SMOKE_RESULT -Raw | ConvertFrom-Json
          if (-not $uiResult.ok) {
            if (Test-Path $env:ERASER_STARTUP_LOG) { Get-Content $env:ERASER_STARTUP_LOG }
            throw "Le test interactif a échoué : $($uiResult.error)"
          }
          Write-Host "Application installée, interface interactive, compte créé et session ouverte sur $($startup.url)."
          Get-Process -Name "Eraser" -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Conserver l’installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Eraser-Windows
          path: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Eraser-Setup.exe
            release/latest.yml
            release/*.blockmap

      - name: Publier la préversion de migration
        if: github.ref == 'refs/heads/windows-app-migration' && contains(github.event.head_commit.message, '[publish alpha]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "release/Eraser-Setup.exe" `
            "release/latest.yml" `
            "release/Eraser-Setup.exe.blockmap" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Eraser v$version" `
            --notes-file "RELEASE_ALPHA.md" `
            --prerelease
